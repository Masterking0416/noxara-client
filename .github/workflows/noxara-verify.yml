name: Noxara 26.3 verification

on:
  push:
    branches:
      - "noxara/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noxara-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Java 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build -Pcommit=${{ github.sha }} -Pbuild_number=ci

      - name: Upload Noxara client JAR
        uses: actions/upload-artifact@v7
        with:
          name: noxara-client-26.3-test-build
          path: build/libs/noxara-client-*-ci.jar
          if-no-files-found: error
          retention-days: 14
